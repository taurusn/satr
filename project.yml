name: Linen
options:
  bundleIdPrefix: com.hatim
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: 2U8YZJV343
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  LinenKit:
    path: LinenKit
targets:
  Linen:
    type: application
    platform: macOS
    sources:
      - path: Linen
    dependencies:
      - package: LinenKit
      - target: LinenQuickLook
        embed: true
      # The agent kit's command (CLI-1). Contents/Helpers, not Contents/MacOS: "linen" and "Linen" are one name on a
      # case-insensitive disk.
      - target: LinenCommand
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.linen
        PRODUCT_NAME: Linen
        INFOPLIST_FILE: Linen/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts: []
    postCompileScripts:
      - name: Copy renderer and fonts
        script: bash "$SRCROOT/Scripts/copy-renderer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/renderer"
        basedOnDependencyAnalysis: false
  LinenCommand:
    type: tool
    platform: macOS
    sources:
      - path: Tools/linen
      # The vault gate's descriptor walk (SAFE-2), shared with the app so the command reads files the same way.
      - path: Linen/Document/SafeOpen.swift
    dependencies:
      - package: LinenKit
    settings:
      base:
        PRODUCT_NAME: linen
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.linen.command
        SKIP_INSTALL: YES
  LinenQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: LinenQuickLook
    dependencies:
      - package: LinenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatim.linen.quicklook
        PRODUCT_NAME: LinenQuickLook
        INFOPLIST_FILE: LinenQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: LinenQuickLook/LinenQuickLook.entitlements
        GENERATE_INFOPLIST_FILE: NO
    postCompileScripts:
      - name: Copy renderer and fonts
        script: bash "$SRCROOT/Scripts/copy-renderer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/renderer"
        basedOnDependencyAnalysis: false
